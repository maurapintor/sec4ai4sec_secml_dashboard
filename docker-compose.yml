services:
  secml-dashboard:
    build: .
    image: secml-dashboard:latest
    ports:
      - "9000:9000"
    volumes:
      # Persists the ~1.1GB Pix2Struct-DocVQA download across container restarts.
      - hf-cache:/app/.cache/huggingface
    restart: unless-stopped
    # GPU access (needs the NVIDIA Container Toolkit installed on the host —
    # see README). Drop this block entirely to run CPU-only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
